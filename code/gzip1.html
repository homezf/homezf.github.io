
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GZIP在线加密解密工具</title>
  <script src="https://cdn.bootcss.com/pako/1.0.6/pako.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .copy-btn {
      transition: all 0.3s ease;
    }
    .copy-btn:hover {
      transform: scale(1.05);
    }
    .copy-btn.copied {
      background-color: #10B981 !important;
    }
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">GZIP在线加密解密工具</h1>
      <p class="text-gray-600">支持文本压缩加密与解密还原，一键复制结果</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- 输入区域 -->
      <div class="card bg-white rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-gray-800">输入文本</h2>
          <div class="flex space-x-2">
            <button onclick="clearInput()" class="px-3 py-1 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
              <i class="fas fa-eraser mr-1"></i>清空
            </button>
          </div>
        </div>
        <textarea 
          id="inputText" 
          placeholder="请输入要处理的文本内容..." 
          class="w-full h-64 p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
        ></textarea>
        <div class="mt-4 flex flex-wrap gap-3">
          <button 
            onclick="encode()" 
            class="flex-1 px-4 py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl hover:from-blue-600 hover:to-indigo-700 transition shadow-md hover:shadow-lg"
          >
            <i class="fas fa-compress-alt mr-2"></i>GZIP压缩并Base64编码
          </button>
          <button 
            onclick="decode()" 
            class="flex-1 px-4 py-3 bg-gradient-to-r from-green-500 to-teal-600 text-white rounded-xl hover:from-green-600 hover:to-teal-700 transition shadow-md hover:shadow-lg"
          >
            <i class="fas fa-expand-alt mr-2"></i>Base64解码并GZIP解压
          </button>
        </div>
      </div>

      <!-- 输出区域 -->
      <div class="card bg-white rounded-2xl shadow-lg p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-gray-800">处理结果</h2>
          <button 
            id="copyBtn" 
            onclick="copyResult()" 
            class="copy-btn px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition flex items-center"
          >
            <i class="fas fa-copy mr-2"></i>复制结果
          </button>
        </div>
        <div class="relative">
          <textarea 
            id="outputText" 
            placeholder="处理结果将显示在此处..." 
            class="w-full h-64 p-4 border border-gray-300 rounded-xl bg-gray-50 resize-none"
            readonly
          ></textarea>
          <div id="copyStatus" class="absolute top-2 right-2 text-sm text-green-600 font-medium hidden">
            <i class="fas fa-check-circle mr-1"></i>已复制!
          </div>
        </div>
        <div class="mt-4 bg-blue-50 rounded-xl p-4">
          <h3 class="font-medium text-gray-800 mb-2"><i class="fas fa-info-circle text-blue-500 mr-2"></i>使用说明</h3>
          <ul class="text-sm text-gray-600 space-y-1">
            <li>• 点击"压缩编码"将文本进行GZIP压缩并转为Base64</li>
            <li>• 点击"解码解压"将Base64内容还原为原始文本</li>
            <li>• 使用复制按钮快速复制处理结果</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="mt-10 bg-white rounded-2xl shadow-lg p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">技术说明</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-blue-50 p-4 rounded-xl">
          <h3 class="font-medium text-gray-800 mb-2"><i class="fas fa-compress-alt text-blue-500 mr-2"></i>GZIP压缩</h3>
          <p class="text-sm text-gray-600">使用pako库实现高效的GZIP压缩算法，有效减小数据体积</p>
        </div>
        <div class="bg-green-50 p-4 rounded-xl">
          <h3 class="font-medium text-gray-800 mb-2"><i class="fas fa-lock text-green-500 mr-2"></i>Base64编码</h3>
          <p class="text-sm text-gray-600">将二进制压缩数据转换为文本格式，便于传输和存储</p>
        </div>
        <div class="bg-purple-50 p-4 rounded-xl">
          <h3 class="font-medium text-gray-800 mb-2"><i class="fas fa-bolt text-purple-500 mr-2"></i>一键复制</h3>
          <p class="text-sm text-gray-600">新增复制功能，快速将结果复制到剪贴板</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function encode() {
      const input = document.getElementById('inputText').value;
      if (!input.trim()) {
        alert('请输入要处理的文本内容');
        return;
      }
      
      try {
        const compressed = pako.gzip(input, { to: "string" });
        const encoded = btoa(compressed);
        document.getElementById('outputText').value = encoded;
        resetCopyButton();
      } catch (e) {
        document.getElementById('outputText').value = "压缩失败: " + e.message;
      }
    }

    function decode() {
      const input = document.getElementById('inputText').value;
      if (!input.trim()) {
        alert('请输入要处理的Base64编码内容');
        return;
      }
      
      try {
        const decoded = atob(input);
        const binData = new Uint8Array(decoded.split('').map(function(x) {
          return x.charCodeAt(0);
        }));
        const decompressed = pako.inflate(binData, { to: "string" });
        document.getElementById('outputText').value = decompressed;
        resetCopyButton();
      } catch (e) {
        document.getElementById('outputText').value = "解码失败，请检查输入是否为有效的Base64编码内容";
      }
    }

    function copyResult() {
      const outputText = document.getElementById('outputText');
      if (!outputText.value.trim()) {
        alert('没有可复制的内容');
        return;
      }
      
      outputText.select();
      document.execCommand('copy');
      
      // 更新按钮状态
      const copyBtn = document.getElementById('copyBtn');
      const copyStatus = document.getElementById('copyStatus');
      
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = '<i class="fas fa-check mr-2"></i>已复制';
      copyStatus.classList.remove('hidden');
      
      // 3秒后恢复原状态
      setTimeout(() => {
        resetCopyButton();
      }, 3000);
    }

    function resetCopyButton() {
      const copyBtn = document.getElementById('copyBtn');
      const copyStatus = document.getElementById('copyStatus');
      
      copyBtn.classList.remove('copied');
      copyBtn.innerHTML = '<i class="fas fa-copy mr-2"></i>复制结果';
      copyStatus.classList.add('hidden');
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
      document.getElementById('outputText').value = '';
      resetCopyButton();
    }
  </script>
</body>
</html>
